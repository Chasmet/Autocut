name: "CHK · Nettoyage historique Actions"

on:
  push:
    paths:
      - ".github/workflows/chk-actions-cleanup.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Garder seulement le dernier build utile
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{ owner, repo, per_page:100 });
            const completed = runs.filter(r=>r.status==='completed' && r.id!==currentRunId).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
            let keepRunId=null;
            const likelyBuilds=completed.filter(r=>r.conclusion==='success' && /apk|android|release|publish|build|sign|assemble|package|deploy/i.test([r.name,r.path,r.display_title].filter(Boolean).join(' ')));
            const candidates=[...likelyBuilds,...completed.filter(r=>r.conclusion==='success')].filter((r,i,a)=>a.findIndex(x=>x.id===r.id)===i).slice(0,80);
            for(const r of candidates){
              try{
                const arts=await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:r.id,per_page:1});
                if((arts.data.total_count||0)>0){keepRunId=r.id;break;}
              }catch(e){core.warning(`Artefacts run ${r.id}: ${e.message}`);}
            }
            if(!keepRunId) keepRunId=completed.find(r=>r.conclusion==='success')?.id || completed[0]?.id || null;
            const deletable=completed.filter(r=>r.id!==keepRunId).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
            const MAX_DELETE=850;let deleted=0;
            for(const r of deletable.slice(0,MAX_DELETE)){
              try{await github.rest.actions.deleteWorkflowRun({owner,repo,run_id:r.id});deleted++;}
              catch(e){core.warning(`Run ${r.id}: ${e.message}`);}
            }
            core.info(`Nettoyage: ${deleted} runs supprimés; conservé: ${keepRunId ?? 'aucun'}`);
            if(deletable.length>MAX_DELETE) core.notice(`${deletable.length-MAX_DELETE} runs restent pour le prochain passage.`);
